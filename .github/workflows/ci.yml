name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Home Manager (aarch64-darwin)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Check shell syntax
        run: |
          for file in apply.sh commit.sh push.sh; do sh -n "$file"; done
          for file in shell/zprofile shell/zshrc shell/aliases.zsh shell/herdr.zsh; do
            zsh -n "$file"
          done

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check flake outputs
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Build public Home Manager configuration
        run: |
          nix build --no-link --no-update-lock-file --print-build-logs \
            .#homeConfigurations.default.activationPackage
